name: Water Management Daily Automation

on:
  # Menjalankan workflow secara manual dari GitHub
  workflow_dispatch:

  # Menjalankan otomatis setiap hari pukul 07.00 WITA
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Makassar"

permissions:
  contents: read

jobs:
  run-water-management:
    runs-on: ubuntu-latest

    steps:
      # Mengambil kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Menyiapkan Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Menginstal library
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Menjalankan program utama
      - name: Run water management automation
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: python main.py
